services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the client at build time — set to your real public URL when deploying
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.example.com}
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL:-}
    image: bradley-innovations-group:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Runtime overrides for server-side reads (client bundle still uses build-time values)
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.example.com}
      NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL:-}
    restart: unless-stopped
